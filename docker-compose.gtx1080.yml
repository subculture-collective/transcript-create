services:
    migrations:
        build:
            context: ${TRANSCRIPT_CORE_DIR:-.}
            dockerfile: Dockerfile.api
        image: hasanara-api:latest

    api:
        build:
            context: ${TRANSCRIPT_CORE_DIR:-.}
            dockerfile: Dockerfile.api
        image: hasanara-api:latest
        environment:
            SEARCH_BACKEND: postgres
            REDIS_URL: ''
            OPENSEARCH_URL: ''
            ROCM: 'false'
        devices: !override []
        group_add: !override []
        depends_on:
            db:
                condition: service_healthy
            migrations:
                condition: service_completed_successfully

    worker:
        build:
            context: ${TRANSCRIPT_CORE_DIR:-.}
            dockerfile: Dockerfile.ingest.cuda
        image: hasanara-ingest:gtx1080
        environment:
            SEARCH_BACKEND: postgres
            OPENSEARCH_URL: ''
            REDIS_URL: ''
            ROCM: 'false'
            WHISPER_BACKEND: faster-whisper
            WHISPER_MODEL: ${WHISPER_MODEL:-small}
            FORCE_GPU: 'true'
            GPU_DEVICE_PREFERENCE: cuda
            GPU_COMPUTE_TYPES: ${GPU_COMPUTE_TYPES:-int8,float32}
            GPU_MODEL_FALLBACKS: ${GPU_MODEL_FALLBACKS:-small,base,tiny}
            WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-3}
            WHISPER_VAD_FILTER: ${WHISPER_VAD_FILTER:-true}
            ENABLE_DIARIZATION: ${ENABLE_DIARIZATION:-false}
            DIARIZATION_INLINE: 'false'
            DIARIZATION_DEVICE: ${DIARIZATION_DEVICE:-cuda}
            DIARIZATION_MODEL: ${DIARIZATION_MODEL:-pyannote/speaker-diarization-community-1}
            DIARIZATION_FALLBACK_MODEL: ${DIARIZATION_FALLBACK_MODEL:-pyannote/speaker-diarization}
            DIARIZATION_RUNNING_TIMEOUT_MINUTES: ${DIARIZATION_RUNNING_TIMEOUT_MINUTES:-5}
            ENABLE_CUSTOM_VOCABULARY: ${ENABLE_CUSTOM_VOCABULARY:-false}
            ENABLE_TRANSLATION: 'false'
            CLEANUP_AFTER_PROCESS: ${CLEANUP_AFTER_PROCESS:-true}
            CLEANUP_DELETE_WAV: ${CLEANUP_DELETE_WAV:-false}
            YTDLP_COOKIES_PATH: ${YTDLP_COOKIES_PATH:-}
            YTDLP_CLIENT_ORDER: ${YTDLP_CLIENT_ORDER:-default,mweb,web_safari,ios,android,tv}
            YTDLP_TRIES_PER_CLIENT: ${YTDLP_TRIES_PER_CLIENT:-1}
            PO_TOKEN_USE_FOR_AUDIO: ${PO_TOKEN_USE_FOR_AUDIO:-false}
            PO_TOKEN_USE_FOR_CAPTIONS: ${PO_TOKEN_USE_FOR_CAPTIONS:-false}
        gpus: all
        devices: !override []
        group_add: !override []
        depends_on:
            db:
                condition: service_healthy
            migrations:
                condition: service_completed_successfully

    diarization-worker:
        build:
            context: ${TRANSCRIPT_CORE_DIR:-.}
            dockerfile: Dockerfile.cuda.overlay
            args:
                WORKER_RUNTIME_IMAGE: hasanara:gtx1080-runtime
        image: hasanara-diarization:gtx1080
        environment:
            HF_HOME: /root/.cache/hf
            HF_HUB_CACHE: /root/.cache/hf/hub
            TRANSFORMERS_CACHE: /root/.cache/hf/transformers
            SEARCH_BACKEND: postgres
            OPENSEARCH_URL: ''
            REDIS_URL: ''
            ROCM: 'false'
            ENABLE_DIARIZATION: 'true'
            DIARIZATION_INLINE: 'false'
            DIARIZATION_DEVICE: cpu
            DIARIZATION_MODEL: /root/.cache/hf/hub/models--pyannote--speaker-diarization-community-1/snapshots/3533c8cf8e369892e6b79ff1bf80f7b0286a54ee
            DIARIZATION_FALLBACK_MODEL: ''
            DIARIZATION_STRICT: 'true'
            DIARIZATION_REQUIRE_ALLOWLIST: 'true'
            DIARIZATION_EXIT_WHEN_IDLE: 'true'
            DIARIZATION_MAX_DURATION_SECONDS: '600'
            DIARIZATION_MAX_JOBS_PER_PROCESS: '1'
            HF_HUB_OFFLINE: '1'
            TRANSFORMERS_OFFLINE: '1'
        command: ['python3', '-m', 'worker.diarization_loop']
        volumes:
            - ./data:/data:ro
            - ./cache/hf:/root/.cache/hf:ro
        devices: !override []
        group_add: !override []
        depends_on:
            db:
                condition: service_healthy
            migrations:
                condition: service_completed_successfully
        restart: unless-stopped
        healthcheck:
            disable: true

    opensearch:
        profiles: ['full']

    dashboards:
        profiles: ['full']

    prometheus:
        profiles: ['full']

    grafana:
        profiles: ['full']

    backup:
        profiles: ['full']
