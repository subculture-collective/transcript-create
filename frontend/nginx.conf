server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data: https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; frame-src https://www.youtube.com; img-src 'self' data: https:; object-src 'none'; script-src 'self' https://www.youtube.com; style-src 'self' https://fonts.googleapis.com" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The SPA shell names the current hashed assets, so it must be revalidated on
    # every navigation. Without this, browsers can keep an old index.html after
    # a deployment and continue requesting the previous release indefinitely.
    location = /index.html {
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data: https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; frame-src https://www.youtube.com; img-src 'self' data: https:; object-src 'none'; script-src 'self' https://www.youtube.com; style-src 'self' https://fonts.googleapis.com" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Vite assets are content-addressed. Once referenced by a fresh shell they
    # are safe to cache for a year and never need in-place revalidation.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /favicon.ico {
        try_files /favicon.ico =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
