name: Main verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Create isolated Python verification environment
        run: |
          rm -rf -- .verify-venv
          "${{ steps.python.outputs.python-path }}" -m venv .verify-venv
          .verify-venv/bin/python -m pip install --upgrade pip
          .verify-venv/bin/python -m pip install setuptools==83.0.0
          .verify-venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run canonical verification
        run: |
          set -euo pipefail
          gateway="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{println .Gateway}}{{end}}' "$(hostname)" | while IFS= read -r candidate; do
            [[ -n "$candidate" ]] && { printf '%s\n' "$candidate"; break; }
          done)"
          [[ "$gateway" =~ ^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$ ]]
          PYTHON_BIN="$PWD/.verify-venv/bin/python" TEST_SERVICE_HOST="$gateway" make verify
