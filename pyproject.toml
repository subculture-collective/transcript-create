[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transcript-create"
version = "0.1.0"
description = "Create searchable, exportable transcripts from YouTube videos or channels"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "Q"]
ignore = [
    "B008",  # Allow Depends() in FastAPI route defaults.
    "B904",  # Allow compatibility exception handlers without explicit chaining.
    "E501",  # Black owns wrapping; SQL, URLs, and schema descriptions may remain long.
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py files
"scripts/*.py" = ["E402"]  # Allow module imports after sys.path manipulation in scripts
"tests/scripts/test_backfill_formatting.py" = ["E402"]
"tests/worker/test_pipeline_stages.py" = ["E402"]

[tool.black]
line-length = 120
target-version = ['py311']
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | build
  | dist
  | \.eggs
  | .*\.egg-info
)/
'''

[tool.isort]
profile = "black"
line_length = 120
src_paths = ["app", "worker", "scripts", "tests", "alembic"]
known_first_party = ["app", "worker", "tests", "scripts", "alembic"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    ".venv/",
    "venv/",
]

[tool.bandit]
exclude_dirs = [".venv", "venv", "tests"]
skips = ["B101"]  # Skip assert_used test

[tool.pytest.ini_options]
norecursedirs = [".git", ".venv", "venv", "docker-volumes", "data", "deploy-backups"]
markers = [
    "timeout: marks tests with execution timeout (deselect with '-m \"not timeout\"')",
]
