server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data: https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; frame-src https://www.youtube.com; img-src 'self' data: https:; object-src 'none'; script-src 'self' https://www.youtube.com; style-src 'self' https://fonts.googleapis.com" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico {
        try_files /favicon.ico =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
