# Host-storage override for deployments where project data should live with the
# compose directory instead of Docker's default /var/lib/docker volume store.
# State paths are relative to the Compose project directory; production client
# deployments use scripts/compose_prod.sh, which sets it to the deployment root.

services:
    db:
        volumes: !override
            - ./docker-volumes/dbdata:/var/lib/postgresql/data

    redis:
        volumes: !override
            - ./docker-volumes/redis-data:/data

    prometheus:
        volumes: !override
            - ${TRANSCRIPT_CORE_DIR:-.}/config/prometheus:/etc/prometheus
            - ./docker-volumes/prometheus-data:/prometheus

    grafana:
        volumes: !override
            - ./docker-volumes/grafana-data:/var/lib/grafana
            - ${TRANSCRIPT_CORE_DIR:-.}/config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
            - ${TRANSCRIPT_CORE_DIR:-.}/config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
            - ${TRANSCRIPT_CORE_DIR:-.}/config/grafana/dashboards:/var/lib/grafana/dashboards:ro

    backup:
        volumes: !override
            - ./docker-volumes/dbdata:/var/lib/postgresql/data:ro
            - ./backups:/backups
            - ${TRANSCRIPT_CORE_DIR:-.}/scripts:/scripts:ro
            - ./data:/data:ro
