name: Release candidate artifacts

on:
  push:
    tags:
      - 'v*-rc.*'
      - 'v*-beta.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Authorize prerelease or validation
        env:
          EVENT_NAME: ${{ gitea.event_name }}
          REF: ${{ gitea.ref }}
          REF_NAME: ${{ gitea.ref_name }}
          ACTOR: ${{ gitea.actor }}
          RELEASE_OPERATOR: ${{ vars.RELEASE_OPERATOR }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_OPERATOR" && "$ACTOR" == "$RELEASE_OPERATOR" ]]
          if [[ "$EVENT_NAME" == push ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+(\.[0-9]+)*-(rc|beta)\.[0-9]+([-.][0-9A-Za-z]+)*$ ]]
          else
            [[ "$EVENT_NAME" == workflow_dispatch ]]
            [[ "$REF" =~ ^refs/heads/release/v[0-9]+(\.[0-9]+)*-(rc|beta)\.[0-9]+([-.][0-9A-Za-z]+)*$ ]]
          fi
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Create isolated Python verification environment
        run: |
          rm -rf -- .release-venv
          "${{ steps.python.outputs.python-path }}" -m venv .release-venv
          .release-venv/bin/python -m pip install --upgrade pip
          .release-venv/bin/python -m pip install setuptools==83.0.0
          .release-venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install frontend and end-to-end dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix e2e
      - name: Install Chromium
        run: npx --prefix e2e playwright install --with-deps chromium
      - name: Run canonical verification
        run: |
          set -euo pipefail
          gateway="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{println .Gateway}}{{end}}' "$(hostname)" | while IFS= read -r candidate; do
            [[ -n "$candidate" ]] && { printf '%s\n' "$candidate"; break; }
          done)"
          [[ "$gateway" =~ ^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$ ]]
          PYTHON_BIN="$PWD/.release-venv/bin/python" TEST_SERVICE_HOST="$gateway" make verify

  cross-browser:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - browser: firefox
            project: firefox
            evidence: firefox-desktop
          - browser: webkit
            project: webkit
            evidence: webkit-desktop
          - browser: chromium
            project: Mobile Chrome
            evidence: chromium-mobile
          - browser: webkit
            project: Mobile Safari
            evidence: webkit-mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Install frontend and end-to-end dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix e2e
      - name: Install ${{ matrix.browser }}
        run: npx --prefix e2e playwright install --with-deps ${{ matrix.browser }}
      - name: Run seeded archive smoke test
        working-directory: e2e
        run: npx playwright test tests/archive-smoke.spec.ts --project="${{ matrix.project }}" --workers=1
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: cross-browser-${{ matrix.browser }}-${{ matrix.project }}
          if-no-files-found: warn
          path: |
            e2e/test-results
            e2e/playwright-report
      - name: Create cross-browser success marker
        run: |
          set -euo pipefail
          mkdir -p cross-browser-success
          printf '%s' '${{ gitea.sha }}' > "cross-browser-success/${{ matrix.evidence }}.sha"
      - name: Upload cross-browser success marker
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: cross-browser-success-${{ matrix.evidence }}
          path: cross-browser-success/${{ matrix.evidence }}.sha

  cross-browser-gate:
    runs-on: ubuntu-latest
    needs: cross-browser
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ gitea.sha }}
      - name: Download Firefox desktop success marker
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: cross-browser-success-firefox-desktop
          path: cross-browser-evidence/firefox-desktop
      - name: Download WebKit desktop success marker
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: cross-browser-success-webkit-desktop
          path: cross-browser-evidence/webkit-desktop
      - name: Download Chromium mobile success marker
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: cross-browser-success-chromium-mobile
          path: cross-browser-evidence/chromium-mobile
      - name: Download WebKit mobile success marker
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: cross-browser-success-webkit-mobile
          path: cross-browser-evidence/webkit-mobile
      - name: Validate cross-browser success markers
        run: python3 scripts/validate_browser_evidence.py --root cross-browser-evidence --sha '${{ gitea.sha }}'

  images:
    runs-on: switchyard-production
    needs: [verify, cross-browser-gate]
    if: >-
      needs.verify.result == 'success' && needs.cross-browser-gate.result == 'success' &&
      vars.RELEASE_OPERATOR != '' && gitea.actor == vars.RELEASE_OPERATOR &&
      (gitea.event_name == 'push' ||
      (gitea.event_name == 'workflow_dispatch' && startsWith(gitea.ref, 'refs/heads/release/v')))
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - role: api
            dockerfile: Dockerfile.api
            image: git.subcult.tv/subculture-collective/hasanara-api
          - role: ingest-cuda
            dockerfile: Dockerfile.ingest.cuda
            image: git.subcult.tv/subculture-collective/hasanara-ingest-cuda
          - role: ml-cuda
            dockerfile: Dockerfile.cuda
            image: git.subcult.tv/subculture-collective/hasanara-ml-cuda
          - role: frontend
            dockerfile: frontend/Dockerfile
            image: git.subcult.tv/subculture-collective/hasanara-frontend
          - role: postgres-walg
            dockerfile: Dockerfile.postgres-walg
            image: git.subcult.tv/subculture-collective/hasanara-postgres-walg
    steps:
      - name: Authorize registry use
        env:
          EVENT_NAME: ${{ gitea.event_name }}
          REF: ${{ gitea.ref }}
          REF_NAME: ${{ gitea.ref_name }}
          ACTOR: ${{ gitea.actor }}
          RELEASE_OPERATOR: ${{ vars.RELEASE_OPERATOR }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_OPERATOR" && "$ACTOR" == "$RELEASE_OPERATOR" ]]
          if [[ "$EVENT_NAME" == push ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+(\.[0-9]+)*-(rc|beta)\.[0-9]+([-.][0-9A-Za-z]+)*$ ]]
          else
            [[ "$EVENT_NAME" == workflow_dispatch && "$REF" =~ ^refs/heads/release/v[0-9]+(\.[0-9]+)*-(rc|beta)\.[0-9]+([-.][0-9A-Za-z]+)*$ ]]
          fi
      - name: Validate release prerequisites
        env:
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_PAT: ${{ secrets.REGISTRY_PAT }}
          COSIGN_PUBLIC_KEY_B64: ${{ vars.COSIGN_PUBLIC_KEY_B64 }}
          HASANARA_REDIS_IMAGE: ${{ vars.HASANARA_REDIS_IMAGE }}
        run: |
          set -euo pipefail
          for required in REGISTRY_USER REGISTRY_PAT COSIGN_PUBLIC_KEY_B64; do
            [[ -n "${!required}" ]] || { printf '%s is required\n' "$required" >&2; exit 1; }
          done
          [[ "$HASANARA_REDIS_IMAGE" =~ ^[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]]
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set release image tag
        id: target
        run: |
          set -euo pipefail
          if [[ '${{ gitea.event_name }}' == push ]]; then
            tag='${{ gitea.ref_name }}'
          else
            short_sha="$(printf '%s' '${{ gitea.sha }}' | cut -c1-12)"
            tag="validation-${short_sha}-${{ gitea.run_number }}"
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'build_date=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          name: hasanara-${{ gitea.run_id }}-${{ matrix.role }}
          driver: docker-container
          driver-opts: |
            cpu-period=100000
            cpu-quota=200000
            memory=4g
            memory-swap=4g
      - name: Log in to Gitea registry
        env:
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_PAT: ${{ secrets.REGISTRY_PAT }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if printf '%s' "$REGISTRY_PAT" | docker login git.subcult.tv --username "$REGISTRY_USER" --password-stdin; then
              exit 0
            fi
            if (( attempt < 3 )); then
              sleep "$((attempt * 2))"
            fi
          done
          exit 1
      - name: Build ${{ matrix.role }} once for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ matrix.image }}:${{ steps.target.outputs.tag }}
          build-args: |
            GIT_COMMIT=${{ gitea.sha }}
            BUILD_DATE=${{ steps.target.outputs.build_date }}
      - name: Prepare pinned Trivy scanner cache
        id: trivy
        run: |
          set -euo pipefail
          trivy_image='docker.io/aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e'
          [[ "$trivy_image" =~ ^docker\.io/aquasec/trivy@sha256:[0-9a-f]{64}$ ]]
          cache_volume="hasanara-trivy-${{ gitea.run_id }}-${{ matrix.role }}"
          docker volume create "$cache_volume" >/dev/null
          printf 'image=%s\ncache_volume=%s\n' "$trivy_image" "$cache_volume" >> "$GITHUB_OUTPUT"
      - name: Block local high and critical application-library vulnerabilities
        env:
          TRIVY_IMAGE: ${{ steps.trivy.outputs.image }}
          TRIVY_CACHE_VOLUME: ${{ steps.trivy.outputs.cache_volume }}
          IMAGE_REF: ${{ matrix.image }}:${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ '${{ matrix.role }}' == ml-cuda ]]; then
            docker run --rm --network none --cpus=2 --memory=4g \
              -v "$PWD/scripts/check_lightning_patch.py:/check.py:ro" \
              --entrypoint python3 "$IMAGE_REF" /check.py
          fi
          docker run --rm \
            --cpus=2 --memory=4g --memory-swap=4g --pids-limit=512 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$TRIVY_CACHE_VOLUME:/root/.cache/trivy" \
            -v "$PWD/security/lightning-2.6.6.vex.json:/lightning.vex.json:ro" \
            "$TRIVY_IMAGE" image --timeout 15m --cache-dir /root/.cache/trivy --vex /lightning.vex.json --scanners vuln --format sarif \
            --severity CRITICAL,HIGH --pkg-types library --exit-code 1 "$IMAGE_REF" \
            > "trivy-${{ matrix.role }}-local-library.sarif"
      - name: Push scanned local image and resolve digest
        id: publish
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ steps.target.outputs.tag }}
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_PAT: ${{ secrets.REGISTRY_PAT }}
        run: |
          set -euo pipefail
          skopeo_image='quay.io/skopeo/stable@sha256:47853bb9fb24202af9110531ebd6e43c5f97701254ca290596640290d17942f4'
          [[ "$skopeo_image" =~ ^quay\.io/skopeo/stable@sha256:[0-9a-f]{64}$ ]]
          repository="${IMAGE#git.subcult.tv/}"
          network=""
          network_args=()
          destination="docker://${IMAGE}:${TAG}"
          destination_tls_verify=true
          evidence_volume="hasanara-push-evidence-${{ gitea.run_id }}-${{ matrix.role }}"
          cleanup() {
            if [[ -n "$network" ]]; then
              docker network disconnect "$network" gitea >/dev/null 2>&1 || true
              docker network rm "$network" >/dev/null 2>&1 || true
            fi
            docker volume rm --force "$evidence_volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$evidence_volume" >/dev/null
          if docker container inspect gitea >/dev/null 2>&1; then
            network="hasanara-push-${{ gitea.run_id }}-${{ matrix.role }}"
            network_args=(--network "$network")
            destination="docker://registry-origin:3000/${repository}:${TAG}"
            destination_tls_verify=false
            docker network create --internal "$network" >/dev/null
            docker network connect --alias registry-origin "$network" gitea
          fi
          copied=false
          for attempt in 1 2 3; do
            if registry_token="$(curl --fail-with-body --silent --show-error --get \
              --user "$REGISTRY_USER:$REGISTRY_PAT" \
              --data-urlencode "service=container_registry" \
              --data-urlencode "scope=repository:${repository}:pull,push" \
              https://git.subcult.tv/v2/token | python3 -c 'import json, sys; payload = json.load(sys.stdin); token = payload.get("token") or payload.get("access_token"); assert isinstance(token, str) and token; print(token)')"; then
              if REGISTRY_BEARER_TOKEN="$registry_token" docker run --rm "${network_args[@]}" \
                --cpus=1 --memory=1g --memory-swap=1g --pids-limit=128 \
                -v /var/run/docker.sock:/var/run/docker.sock \
                -v "$evidence_volume:/evidence" \
                -e REGISTRY_BEARER_TOKEN \
                -e DESTINATION="$destination" \
                -e DESTINATION_TLS_VERIFY="$destination_tls_verify" \
                -e IMAGE \
                -e TAG \
                --entrypoint /bin/sh \
                "$skopeo_image" -ec '
                  rm -f /evidence/pushed.digest
                  skopeo copy --dest-registry-token "$REGISTRY_BEARER_TOKEN" --dest-tls-verify="$DESTINATION_TLS_VERIFY" \
                    --digestfile /evidence/pushed.digest \
                    "docker-daemon:${IMAGE}:${TAG}" "$DESTINATION"
                '; then
                copied=true
                break
              fi
            fi
            if (( attempt < 3 )); then
              sleep "$((attempt * 2))"
            fi
          done
          [[ "$copied" == true ]]
          pushed_digest="$(docker run --rm --cpus=0.25 --memory=128m --memory-swap=128m --pids-limit=32 -v "$evidence_volume:/evidence:ro" --entrypoint /bin/sh "$skopeo_image" -ec 'cat /evidence/pushed.digest')"
          [[ "$pushed_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          canonical_digest="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}')"
          [[ "$canonical_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$canonical_digest" == "$pushed_digest" ]]
          # Materialize the immutable reference in the authenticated host daemon.
          # Trivy runs in a container and cannot invoke host credential helpers,
          # but it can inspect this local digest through the mounted Docker socket.
          docker pull "$IMAGE@$canonical_digest" >/dev/null
          printf 'digest=%s\n' "$canonical_digest" >> "$GITHUB_OUTPUT"
      - name: Block digest high and critical application-library vulnerabilities
        env:
          TRIVY_IMAGE: ${{ steps.trivy.outputs.image }}
          TRIVY_CACHE_VOLUME: ${{ steps.trivy.outputs.cache_volume }}
          IMAGE_REF: ${{ matrix.image }}@${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ '${{ matrix.role }}' == ml-cuda ]]; then
            docker run --rm --network none --cpus=2 --memory=4g \
              -v "$PWD/scripts/check_lightning_patch.py:/check.py:ro" \
              --entrypoint python3 "$IMAGE_REF" /check.py
          fi
          docker run --rm \
            --cpus=2 --memory=4g --memory-swap=4g --pids-limit=512 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v "$TRIVY_CACHE_VOLUME:/root/.cache/trivy" \
            -v "$PWD/security/lightning-2.6.6.vex.json:/lightning.vex.json:ro" \
            "$TRIVY_IMAGE" image --timeout 15m --cache-dir /root/.cache/trivy --vex /lightning.vex.json --scanners vuln --format sarif \
            --severity CRITICAL,HIGH --pkg-types library --exit-code 1 "$IMAGE_REF" \
            > "trivy-${{ matrix.role }}-library.sarif"
      - name: Report digest OS vulnerabilities
        if: always() && steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          TRIVY_IMAGE: ${{ steps.trivy.outputs.image }}
          TRIVY_CACHE_VOLUME: ${{ steps.trivy.outputs.cache_volume }}
          IMAGE_REF: ${{ matrix.image }}@${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm \
            --cpus=2 --memory=4g --memory-swap=4g --pids-limit=512 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v "$TRIVY_CACHE_VOLUME:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --timeout 15m --cache-dir /root/.cache/trivy --scanners vuln --format sarif \
            --severity CRITICAL,HIGH --pkg-types os --exit-code 0 "$IMAGE_REF" \
            > "trivy-${{ matrix.role }}-os.sarif"
      - name: Generate SPDX JSON SBOM for digest
        env:
          TRIVY_IMAGE: ${{ steps.trivy.outputs.image }}
          TRIVY_CACHE_VOLUME: ${{ steps.trivy.outputs.cache_volume }}
          IMAGE_REF: ${{ matrix.image }}@${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm \
            --cpus=2 --memory=4g --memory-swap=4g --pids-limit=512 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v "$TRIVY_CACHE_VOLUME:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --timeout 15m --cache-dir /root/.cache/trivy --format spdx-json --exit-code 0 "$IMAGE_REF" \
            > "${{ matrix.role }}.spdx.json"
      - name: Remove Trivy scanner cache
        if: always()
        env:
          TRIVY_CACHE_VOLUME: ${{ steps.trivy.outputs.cache_volume }}
        run: |
          set -euo pipefail
          if [[ -n "$TRIVY_CACHE_VOLUME" ]]; then
            docker volume rm --force "$TRIVY_CACHE_VOLUME" >/dev/null
          fi
      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Generate provenance and image fragment
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          ROLE: ${{ matrix.role }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          SOURCE_COMMIT: ${{ gitea.sha }}
          RUN_ID: ${{ gitea.run_id }}
          REPOSITORY_URI: https://git.subcult.tv/${{ gitea.repository }}
        run: |
          set -euo pipefail
          export TIMESTAMP="$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          image = f"{os.environ['IMAGE']}@{os.environ['DIGEST']}"
          Path(f"{os.environ['ROLE']}.json").write_text(json.dumps({"role": os.environ["ROLE"], "image": image}) + "\n")
          Path(f"{os.environ['ROLE']}.provenance.json").write_text(json.dumps({
              "buildType": "https://hasanara.example/release",
              "builder": {"id": f"gitea-run/{os.environ['RUN_ID']}"},
              "invocation": {"configSource": {"uri": os.environ["REPOSITORY_URI"], "digest": {"sha1": os.environ["SOURCE_COMMIT"]}, "entryPoint": os.environ["DOCKERFILE"]}, "parameters": {"role": os.environ["ROLE"], "dockerfile": os.environ["DOCKERFILE"]}},
              "metadata": {"buildInvocationId": os.environ["RUN_ID"], "buildStartedOn": os.environ["TIMESTAMP"], "buildFinishedOn": os.environ["TIMESTAMP"], "completeness": {"parameters": True, "environment": False, "materials": True}, "reproducible": False},
              "materials": [{"uri": os.environ["REPOSITORY_URI"], "digest": {"sha1": os.environ["SOURCE_COMMIT"]}}]
          }) + "\n")
          PY
      - name: Sign and attest digest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE_REF: ${{ matrix.image }}@${{ steps.publish.outputs.digest }}
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMAGE_REF"
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY --type slsaprovenance --predicate "${ROLE}.provenance.json" "$IMAGE_REF"
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY --type spdxjson --predicate "${ROLE}.spdx.json" "$IMAGE_REF"
      - name: Verify signed digest evidence
        env:
          COSIGN_PUBLIC_KEY_B64: ${{ vars.COSIGN_PUBLIC_KEY_B64 }}
          IMAGE_REF: ${{ matrix.image }}@${{ steps.publish.outputs.digest }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          ROLE: ${{ matrix.role }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          SOURCE_COMMIT: ${{ gitea.sha }}
          REPOSITORY_URI: https://git.subcult.tv/${{ gitea.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          try:
              public_key = base64.b64decode(os.environ["COSIGN_PUBLIC_KEY_B64"], validate=True)
          except (KeyError, binascii.Error) as error:
              raise SystemExit("invalid COSIGN_PUBLIC_KEY_B64") from error
          if not public_key:
              raise SystemExit("invalid COSIGN_PUBLIC_KEY_B64")
          Path(f"{os.environ['ROLE']}.cosign.pub").write_bytes(public_key)
          PY
          cosign verify --key "${ROLE}.cosign.pub" "$IMAGE_REF" > "${ROLE}.signature.verify.json"
          cosign verify-attestation --key "${ROLE}.cosign.pub" --type slsaprovenance "$IMAGE_REF" > "${ROLE}.provenance.verify.json"
          cosign verify-attestation --key "${ROLE}.cosign.pub" --type spdxjson "$IMAGE_REF" > "${ROLE}.sbom.verify.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          import base64
          import binascii

          expected_digest = os.environ["DIGEST"].removeprefix("sha256:")
          expected_commit = os.environ["SOURCE_COMMIT"]
          expected_role = os.environ["ROLE"]
          expected_dockerfile = os.environ["DOCKERFILE"]
          expected_repository = os.environ["REPOSITORY_URI"]

          def statements(path):
              text = Path(path).read_text(encoding="utf-8")
              if not text.strip():
                  raise SystemExit("invalid verified attestation output")
              try:
                  parsed = json.loads(text)
              except json.JSONDecodeError:
                  try:
                      parsed = [json.loads(line) for line in text.splitlines() if line.strip()]
                  except json.JSONDecodeError as error:
                      raise SystemExit("invalid verified attestation output") from error
              envelopes = parsed if isinstance(parsed, list) else [parsed]
              if not envelopes:
                  raise SystemExit("invalid verified attestation output")
              decoded_statements = []
              for envelope in envelopes:
                  if (
                      not isinstance(envelope, dict)
                      or envelope.get("payloadType") != "application/vnd.in-toto+json"
                      or not isinstance(envelope.get("payload"), str)
                      or not envelope["payload"]
                  ):
                      raise SystemExit("invalid verified attestation output")
                  try:
                      payload = base64.b64decode(envelope["payload"], validate=True)
                      statement = json.loads(payload.decode("utf-8"))
                  except (binascii.Error, UnicodeDecodeError, json.JSONDecodeError, ValueError) as error:
                      raise SystemExit("invalid verified attestation output") from error
                  if not isinstance(statement, dict):
                      raise SystemExit("invalid verified attestation output")
                  decoded_statements.append(statement)
              return decoded_statements

          def has_subject(statement):
              return any(
                  isinstance(subject, dict)
                  and subject.get("digest") == {"sha256": expected_digest}
                  for subject in statement.get("subject", [])
              )

          def is_expected_slsa(statement):
              predicate = statement.get("predicate", {})
              config_source = predicate.get("invocation", {}).get("configSource", {})
              parameters = predicate.get("invocation", {}).get("parameters", {})
              return (
                  statement.get("predicateType") == "https://slsa.dev/provenance/v0.2"
                  and has_subject(statement)
                  and config_source.get("uri") == expected_repository
                  and config_source.get("digest") == {"sha1": expected_commit}
                  and config_source.get("entryPoint") == expected_dockerfile
                  and parameters.get("role") == expected_role
                  and parameters.get("dockerfile") == expected_dockerfile
                  and any(
                      material.get("uri") == expected_repository
                      and material.get("digest") == {"sha1": expected_commit}
                      for material in predicate.get("materials", [])
                      if isinstance(material, dict)
                  )
              )

          if not any(is_expected_slsa(statement) for statement in statements(f"{expected_role}.provenance.verify.json")):
              raise SystemExit("no verified SLSA attestation matches this release")
          if not any(
              statement.get("predicateType") == "https://spdx.dev/Document" and has_subject(statement)
              for statement in statements(f"{expected_role}.sbom.verify.json")
          ):
              raise SystemExit("no verified SPDX attestation matches this release")
          PY
      - name: Upload ${{ matrix.role }} image evidence
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: image-evidence-${{ matrix.role }}
          path: |
            ${{ matrix.role }}.json
            trivy-${{ matrix.role }}-library.sarif
            trivy-${{ matrix.role }}-os.sarif
            ${{ matrix.role }}.spdx.json
            ${{ matrix.role }}.provenance.json
            ${{ matrix.role }}.cosign.pub
            ${{ matrix.role }}.signature.verify.json
            ${{ matrix.role }}.provenance.verify.json
            ${{ matrix.role }}.sbom.verify.json
      - name: Log out of Gitea registry
        if: always()
        run: docker logout git.subcult.tv >/dev/null 2>&1 || true
      - name: Remove local validation image
        if: always()
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          if [[ -n "$IMAGE" && -n "$TAG" ]]; then
            docker image rm "$IMAGE:$TAG" >/dev/null 2>&1 || true
          fi

  release:
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: read
      releases: write
    steps:
      - name: Download API evidence
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: image-evidence-api
          path: image-evidence/api
      - name: Download ingest evidence
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: image-evidence-ingest-cuda
          path: image-evidence/ingest-cuda
      - name: Download ML evidence
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: image-evidence-ml-cuda
          path: image-evidence/ml-cuda
      - name: Download frontend evidence
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: image-evidence-frontend
          path: image-evidence/frontend
      - name: Download database evidence
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: image-evidence-postgres-walg
          path: image-evidence/postgres-walg
      - name: Generate immutable release manifest
        env:
          REDIS_IMAGE: ${{ vars.HASANARA_REDIS_IMAGE }}
          SOURCE_COMMIT: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          roles = ("api", "ingest-cuda", "ml-cuda", "frontend", "postgres-walg")
          ref = re.compile(r"^[^@\s]+@sha256:[0-9a-f]{64}$")
          images = {}
          for role in roles:
              path = Path("image-evidence") / role / f"{role}.json"
              if path.is_symlink() or not path.is_file():
                  raise SystemExit("invalid image fragment")
              try:
                  item = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError) as error:
                  raise SystemExit("invalid image fragment") from error
              if (
                  not isinstance(item, dict)
                  or set(item) != {"role", "image"}
                  or not isinstance(item["role"], str)
                  or not isinstance(item["image"], str)
                  or item["role"] != role
                  or item["role"] in images
                  or not ref.fullmatch(item["image"])
              ):
                  raise SystemExit("invalid image fragment")
              images[item["role"]] = item["image"]
          if set(images) != set(roles) or not ref.fullmatch(os.environ["REDIS_IMAGE"]): raise SystemExit("missing release digest")
          Path("release-images.json").write_text(json.dumps({"schema_version": 1, "source_commit": os.environ["SOURCE_COMMIT"], "images": {**dict(sorted(images.items())), "redis": os.environ["REDIS_IMAGE"]}, "services": {"db": "postgres-walg", "backup": "postgres-walg", "migrations": "api", "api": "api", "analytics-retention": "api", "summary-refresher": "api", "archive-intelligence-refresher": "api", "archive-enrichment-queue": "api", "worker": "ingest-cuda", "diarization-worker": "ml-cuda", "frontend": "frontend", "redis": "redis"}}, indent=2) + "\n")
          PY
      - name: Upload release evidence bundle
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: release-evidence
          path: |
            release-images.json
            image-evidence
      - name: Create Gitea prerelease and attach evidence
        if: gitea.event_name == 'push'
        env:
          API_URL: ${{ gitea.api_url }}
          REPOSITORY: ${{ gitea.repository }}
          TAG: ${{ gitea.ref_name }}
          TOKEN: ${{ gitea.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > release-request.json
          import json, os
          print(json.dumps({"tag_name": os.environ["TAG"], "name": f"Release {os.environ['TAG']}", "body": "Immutable deployment image manifest and evidence attached. Redis is third-party and is not attested by this repository.", "prerelease": True, "draft": False}))
          PY
          release="$(curl --fail-with-body --silent --show-error -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' --data @release-request.json "$API_URL/repos/$REPOSITORY/releases")"
          release_id="$(RELEASE="$release" python3 -c 'import json, os; value=json.loads(os.environ["RELEASE"]); identifier=value.get("id"); assert isinstance(identifier, int); print(identifier)')"
          for asset in release-images.json image-evidence/*/*; do
            name="$(ASSET="$asset" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.path.basename(os.environ["ASSET"]), safe=""))')"
            curl --fail-with-body --silent --show-error -H "Authorization: token $TOKEN" -F "attachment=@$asset" "$API_URL/repos/$REPOSITORY/releases/$release_id/assets?name=$name" >/dev/null
          done
