name: Docker Build All Variants

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.cpu"
      - "Dockerfile.cuda"
      - ".dockerignore"
      - "requirements.txt"
      - "requirements-ml-runtime.txt"
      - "constraints.txt"
      - "scripts/verify_ml_runtime.py"
      - "scripts/build-*.sh"
      - "scripts/scan-container-image.sh"
      - ".github/workflows/docker-build-variants.yml"
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push images to registry'
        required: false
        default: false
        type: boolean
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ROCM_VERSION: '7.1'
  CUDA_VERSION: '12.6'

jobs:
  build-rocm:
    name: Build ROCm Variant
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push_images }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ROCm image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rocm${{ env.ROCM_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rocm
          build-args: |
            ROCM_WHEEL_INDEX=https://download.pytorch.org/whl/rocm${{ env.ROCM_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rocm
          format: 'sarif'
          output: 'trivy-rocm-results.sarif'
          severity: 'CRITICAL,HIGH'
          pkg-types: 'library'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-rocm-results.sarif'
          category: 'trivy-rocm'

      - name: Report ROCm base-image OS vulnerabilities
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rocm
          format: 'sarif'
          output: 'trivy-rocm-os-results.sarif'
          severity: 'CRITICAL,HIGH'
          pkg-types: 'os'
          exit-code: '0'

      - name: Upload ROCm OS vulnerability report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-rocm-os-results.sarif'
          category: 'trivy-rocm-os'

      - name: Push verified ROCm image
        if: ${{ success() && inputs.push_images }}
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rocm${{ env.ROCM_VERSION }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rocm

      - name: Get image size
        run: |
          SIZE=$(docker images "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rocm" --format "{{.Size}}")
          echo "Image size: ${SIZE}"
          echo "### ROCm Variant :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** ${SIZE}" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** <2.5GB" >> $GITHUB_STEP_SUMMARY

  build-cpu:
    name: Build CPU Variant
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push_images }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CPU image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.cpu
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cpu
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cpu
          format: 'sarif'
          output: 'trivy-cpu-results.sarif'
          severity: 'CRITICAL,HIGH'
          pkg-types: 'library'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-cpu-results.sarif'
          category: 'trivy-cpu'

      - name: Report CPU base-image OS vulnerabilities
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cpu
          format: 'sarif'
          output: 'trivy-cpu-os-results.sarif'
          severity: 'CRITICAL,HIGH'
          pkg-types: 'os'
          exit-code: '0'

      - name: Upload CPU OS vulnerability report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-cpu-os-results.sarif'
          category: 'trivy-cpu-os'

      - name: Push verified CPU image
        if: ${{ success() && inputs.push_images }}
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cpu

      - name: Get image size
        run: |
          SIZE=$(docker images "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cpu" --format "{{.Size}}")
          echo "Image size: ${SIZE}"
          echo "### CPU Variant :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** ${SIZE}" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** <1GB" >> $GITHUB_STEP_SUMMARY

  build-cuda:
    name: Build CUDA Variant
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push_images }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine CUDA wheel index
        id: cuda
        run: |
          case "${{ env.CUDA_VERSION }}" in
            12.6)
              echo "wheel_index=https://download.pytorch.org/whl/cu126" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "::error::The audited ML runtime supports CUDA 12.6 only"
              exit 1
              ;;
          esac

      - name: Build CUDA image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.cuda
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cuda${{ env.CUDA_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cuda
          build-args: |
            CUDA_WHEEL_INDEX=${{ steps.cuda.outputs.wheel_index }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cuda
          format: 'sarif'
          output: 'trivy-cuda-results.sarif'
          severity: 'CRITICAL,HIGH'
          pkg-types: 'library'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-cuda-results.sarif'
          category: 'trivy-cuda'

      - name: Report CUDA base-image OS vulnerabilities
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cuda
          format: 'sarif'
          output: 'trivy-cuda-os-results.sarif'
          severity: 'CRITICAL,HIGH'
          pkg-types: 'os'
          exit-code: '0'

      - name: Upload CUDA OS vulnerability report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-cuda-os-results.sarif'
          category: 'trivy-cuda-os'

      - name: Push verified CUDA image
        if: ${{ success() && inputs.push_images }}
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cuda${{ env.CUDA_VERSION }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cuda

      - name: Get image size
        run: |
          SIZE=$(docker images "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cuda" --format "{{.Size}}")
          echo "Image size: ${SIZE}"
          echo "### CUDA Variant :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** ${SIZE}" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** <2.5GB" >> $GITHUB_STEP_SUMMARY

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-rocm, build-cpu, build-cuda]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Generate summary
        run: |
          echo "## Docker Build Variants Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All variants built successfully! ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Variants Built:" >> $GITHUB_STEP_SUMMARY
          echo "- ROCm ${{ env.ROCM_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- CPU-only" >> $GITHUB_STEP_SUMMARY
          echo "- CUDA ${{ env.CUDA_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Scans:" >> $GITHUB_STEP_SUMMARY
          echo "Trivy vulnerability scans completed for all variants." >> $GITHUB_STEP_SUMMARY
          echo "Check the Security tab for detailed results." >> $GITHUB_STEP_SUMMARY
