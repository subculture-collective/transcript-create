# HasanAra client identity: the public brand profile and editorial preset are
# read by every application process that loads settings.
x-hasanara-client-environment: &hasanara-client-environment
    SITE_PROFILE_PATH: /config/branding/hasanara.json
    ARCHIVE_EDITORIAL_PRESET: hasanara

x-hasanara-client-volumes: &hasanara-client-volumes
    - ./config/branding:/config/branding:ro

networks:
    management:
        name: management
        external: true
    dev:
        name: dev
        external: true

services:
    redis:
        container_name: hasanara-redis
        ports: !override []

    db:
        container_name: hasanara-db
        ports: !override
            - 10.0.0.200:15432:5432
        restart: unless-stopped
        stop_grace_period: 10m

    migrations:
        container_name: hasanara-migrations
        environment: *hasanara-client-environment
        volumes: *hasanara-client-volumes

    api:
        container_name: hasanara-api
        devices: !override []
        group_add: !override []
        networks:
            - default
            - management
        ports: !override
            - 10.0.0.200:${API_HOST_PORT:-41177}:8000
        environment:
            FRONTEND_ORIGIN: https://hasanara.tv
            CORS_ALLOW_ORIGINS: https://hasanara.tv
            OAUTH_GOOGLE_REDIRECT_URI: ${OAUTH_GOOGLE_REDIRECT_URI:?OAUTH_GOOGLE_REDIRECT_URI is required}
            OAUTH_TWITCH_REDIRECT_URI: ${OAUTH_TWITCH_REDIRECT_URI:?OAUTH_TWITCH_REDIRECT_URI is required}
            BOOTSTRAP_ADMIN_IDENTITIES: ${BOOTSTRAP_ADMIN_IDENTITIES:-}
            FORWARDED_ALLOW_IPS: 172.20.0.250
            RATE_LIMIT_REQUESTS: '100'
            RATE_LIMIT_WINDOW_SECONDS: '60'
            REDIS_URL: redis://redis:6379/0
            OPENSEARCH_TLS_VERIFY: 'true'
            <<: *hasanara-client-environment
        volumes: *hasanara-client-volumes
        restart: unless-stopped

    worker:
        container_name: hasanara-worker
        devices: !override []
        group_add: !override []
        healthcheck:
            disable: true
        ports: !override []
        environment:
            CHANNEL_SYNC_URLS: ${CHANNEL_SYNC_URLS:-https://www.youtube.com/@HasanAbiVODs/videos,https://www.youtube.com/@HasanAbiVODsBackup/videos,https://www.youtube.com/@HasanAbiVODs3/videos}
            CHANNEL_SYNC_INTERVAL_SECONDS: ${CHANNEL_SYNC_INTERVAL_SECONDS:-21600}
            <<: *hasanara-client-environment
        volumes: *hasanara-client-volumes
        restart: unless-stopped
        stop_grace_period: 1h

    summary-refresher:
        image: hasanara-api:latest
        container_name: hasanara-summary-refresher
        cpus: 0.25
        mem_limit: 256m
        memswap_limit: 256m
        pids_limit: 64
        env_file: ${HASANARA_ENV_FILE:-.env}
        environment:
            DATABASE_URL: postgresql+psycopg://postgres:${DB_PASSWORD:-postgres}@db:5432/transcripts
            # The refresh query is CPU-heavy in PostgreSQL; hourly freshness is
            # sufficient and avoids four expensive scans per hour.
            ARCHIVE_SUMMARY_REFRESH_SECONDS: ${ARCHIVE_SUMMARY_REFRESH_SECONDS:-3600}
            OTEL_SDK_DISABLED: 'true'
            PYTHONPATH: /app
            <<: *hasanara-client-environment
        volumes: *hasanara-client-volumes
        depends_on:
            db:
                condition: service_healthy
            migrations:
                condition: service_completed_successfully
        command:
            - sh
            - -c
            - |
                while true; do
                  if python3 /app/scripts/refresh_archive_summary_stats.py; then
                    date +%s > /tmp/summary-refresher-last-success
                  else
                    echo "archive summary refresh failed" >&2
                  fi
                  sleep "$${ARCHIVE_SUMMARY_REFRESH_SECONDS:-900}"
                done
        restart: unless-stopped
        healthcheck:
            test:
                - CMD-SHELL
                - test -f /tmp/summary-refresher-last-success && age=$$(($$(date +%s)-$$(cat /tmp/summary-refresher-last-success))) && max_age=$$(($${ARCHIVE_SUMMARY_REFRESH_SECONDS:-900}*4)) && test "$$age" -lt "$$max_age"
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 30m
        ports: !override []

    archive-intelligence-refresher:
        image: hasanara-api:latest
        container_name: hasanara-archive-intelligence-refresher
        env_file: ${HASANARA_ENV_FILE:-.env}
        environment:
            DATABASE_URL: postgresql+psycopg://postgres:${DB_PASSWORD:-postgres}@db:5432/transcripts
            ARCHIVE_INTELLIGENCE_REFRESH_SECONDS: ${ARCHIVE_INTELLIGENCE_REFRESH_SECONDS:-3600}
            OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
            ARCHIVE_SUMMARY_MODEL: ${ARCHIVE_SUMMARY_MODEL:-qwen3:8b}
            OTEL_SDK_DISABLED: 'true'
            PYTHONPATH: /app
            <<: *hasanara-client-environment
        volumes: *hasanara-client-volumes
        networks:
            - default
            - dev
        depends_on:
            db:
                condition: service_healthy
            migrations:
                condition: service_completed_successfully
        command:
            - sh
            - -c
            - |
                while true; do
                  if python3 /app/scripts/refresh_archive_intelligence.py; then
                    date +%s > /tmp/archive-intelligence-refresher-last-success
                  else
                    echo "archive intelligence refresh failed" >&2
                  fi
                  sleep "$${ARCHIVE_INTELLIGENCE_REFRESH_SECONDS:-3600}"
                done
        restart: unless-stopped
        healthcheck:
            test:
                - CMD-SHELL
                - test -f /tmp/archive-intelligence-refresher-last-success && age=$$(($$(date +%s)-$$(cat /tmp/archive-intelligence-refresher-last-success))) && max_age=$$(($${ARCHIVE_INTELLIGENCE_REFRESH_SECONDS:-3600}*4)) && test "$$age" -lt "$$max_age"
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 90m
        ports: !override []

    diarization-worker:
        # Opt-in only: enable with COMPOSE_PROFILES=diarization.
        profiles: [diarization]
        devices: !override []
        group_add: !override []
        environment:
            ENABLE_DIARIZATION: 'true'
            DIARIZATION_INLINE: 'false'
            DIARIZATION_DEVICE: cpu
            DIARIZATION_MODEL: /root/.cache/hf/hub/models--pyannote--speaker-diarization-community-1/snapshots/3533c8cf8e369892e6b79ff1bf80f7b0286a54ee
            DIARIZATION_FALLBACK_MODEL: ''
            DIARIZATION_STRICT: 'true'
            DIARIZATION_REQUIRE_ALLOWLIST: 'true'
            DIARIZATION_EXIT_WHEN_IDLE: 'true'
            DIARIZATION_MAX_DURATION_SECONDS: '600'
            DIARIZATION_MAX_JOBS_PER_PROCESS: '1'
            HF_HUB_OFFLINE: '1'
            TRANSFORMERS_OFFLINE: '1'
        cpus: 2.0
        mem_limit: 4g
        memswap_limit: 4g
        pids_limit: 256
        healthcheck:
            disable: true
        restart: 'no'

    backup:
        profiles: !override []
        env_file: ${HASANARA_ENV_FILE:-.env}

    analytics-retention:
        environment: *hasanara-client-environment
        volumes: *hasanara-client-volumes

    archive-enrichment-queue:
        environment: *hasanara-client-environment
        volumes: *hasanara-client-volumes

    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
        image: hasanara-frontend:latest
        container_name: hasanara-web
        networks:
            - management
        ports:
            - 10.0.0.200:5173:80
        volumes:
            - ./config/branding/hasanara-assets:/usr/share/nginx/html/branding:ro
        restart: unless-stopped
